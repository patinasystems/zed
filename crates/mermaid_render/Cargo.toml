[package]
name = "mermaid_render"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/mermaid_render.rs"
doctest = false

[features]
test-support = []

[dependencies]
anyhow.workspace = true
# Diagram labels are SVG `<text>`.
gpui = { workspace = true, features = ["svg-text"] }
merman = { workspace = true, features = [
    "layout-cytoscape",
    "svg",
] }
quick-xml.workspace = true
serde_json.workspace = true
tracing.workspace = true
ztracing.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
mermaid_render = { workspace = true, features = ["test-support"] }
usvg = { workspace = true, features = ["text"] }

[package.metadata.cargo-shear]
ignored = ["tracing"]
